name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI never commits, so it needs no git hooks.
  HUSKY: "0"

# MongoDB is pinned to 8.2 (here and in compose.mongo.yaml): the 8.0 line cannot start on kernel 6.19+ (SERVER-121912).
jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Biome
        run: npx biome ci .
      - name: Prettier
        run: npm run format:check
      - name: Front-end structure check
        run: npm run check:structure
      - name: Structure check tests
        run: npm run test:structure

  contract:
    name: Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - name: openapi.json is current
        run: npm run openapi:check --prefix backend
      - name: Generated front-end types are current
        run: |
          npm run generate:api --prefix frontend
          git diff --exit-code -- frontend/src/utils/api-types.generated.ts

  app:
    name: ${{ matrix.app }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      # An app without a package.json has nothing to gate, so its job passes.
      - name: Detect app
        id: detect
        working-directory: .
        run: |
          if [ -f "${{ matrix.app }}/package.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.app }}/package.json does not exist yet; skipping ${{ matrix.app }}."
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - if: steps.detect.outputs.present == 'true'
        run: npm ci
      - if: steps.detect.outputs.present == 'true'
        run: npm run typecheck
      - if: steps.detect.outputs.present == 'true'
        run: npm test
      - if: steps.detect.outputs.present == 'true'
        run: npm run build

  e2e:
    name: Browser journeys and containers
    needs: app
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.2.6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_MONGODB_URI: mongodb://localhost:27017/auth_e2e
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm ci --prefix e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run typecheck
        working-directory: e2e
      - name: Journeys
        run: npm test
        working-directory: e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
      # compose.yaml requires the signing secret; every later compose command reads it from the job's environment.
      - name: Generate the stack's access-token secret
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Build the images and wait for the stack's health checks
        run: docker compose up --build --detach --wait
        # The MongoDB service container already holds host port 27017.
        env:
          MONGO_PORT: "27117"
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
      - name: Stack logs
        if: ${{ failure() && steps.checkout.outcome == 'success' }}
        run: docker compose logs
      - run: docker compose down --volumes
        if: ${{ always() && steps.checkout.outcome == 'success' }}
