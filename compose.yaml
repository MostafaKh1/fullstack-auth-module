# `docker compose up --build` serves the app at http://localhost:8080; `npm run db:up` starts MongoDB alone.
services:
  mongo:
    image: mongo:8.2.6
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      MONGODB_URI: mongodb://mongo:27017/auth
      # Fallback for demonstration only: set JWT_ACCESS_SECRET for any real deployment.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-compose-only-access-secret-change-me-0123456789}
      CORS_ORIGINS: http://localhost:8080
      # Production requires Secure cookies; browsers accept them on http://localhost.
      COOKIE_SECURE: "true"
      # nginx is the one proxy in front: throttle per client, not per proxy.
      TRUST_PROXY: "1"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:3000
    ports:
      - "8080:8080"

volumes:
  mongo-data:
