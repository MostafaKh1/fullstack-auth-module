# `docker compose up --build` serves the app at http://localhost:8080; it needs JWT_ACCESS_SECRET and MONGO_PASSWORD (see README.md).
# MongoDB here is not the development database of compose.mongo.yaml: it requires a password and publishes no port.
services:
  mongo:
    image: mongo:8.2.6
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-auth}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD to a random value (see README.md)}
    volumes:
      - mongo-auth-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand('ping').ok"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      # A hex password needs no URL escaping; any other value must be percent-encoded here.
      MONGODB_URI: mongodb://${MONGO_USER:-auth}:${MONGO_PASSWORD:?set MONGO_PASSWORD to a random value (see README.md)}@mongo:27017/auth?authSource=admin
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET to a random value of at least 32 characters (see README.md)}
      CORS_ORIGINS: http://localhost:8080
      # Production requires Secure cookies. Chrome and Firefox accept them on http://localhost; Safari does not,
      # so in Safari the stack signs in but cannot keep the Session across a reload.
      COOKIE_SECURE: "true"
      # nginx is the one proxy in front: throttle per client, not per proxy.
      TRUST_PROXY: "1"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:3000
    ports:
      - "8080:8080"

volumes:
  mongo-auth-data:
